name: Build Windows installer

# Manual runs (Actions tab) produce a downloadable artifact.
# Pushing a version tag like v1.0.0 builds AND publishes a GitHub Release,
# which the app's auto-updater reads to deliver updates.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release (tag push)
        if: github.ref_type == 'tag'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: file:./prisma/dev.db

      - name: Build installer only (manual run)
        if: github.ref_type != 'tag'
        run: npm run dist:win
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Upload installer artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: interview-coach-windows
          path: release/*.exe
          if-no-files-found: error
